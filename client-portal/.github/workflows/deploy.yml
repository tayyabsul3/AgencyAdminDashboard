name: Deploy to Firebase

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run linting
        run: npm run lint
        
      - name: Run unit tests
        run: npm test -- --run --passWithNoTests
        env:
          NODE_ENV: test
          
      - name: Run integration tests
        run: npm run test:integration
        if: hashFiles('src/__tests__/integration/**/*') != ''
        env:
          NODE_ENV: test

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        environment: [staging, production]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create environment file
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets[format('{0}_FIREBASE_API_KEY', matrix.environment)] }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets[format('{0}_FIREBASE_AUTH_DOMAIN', matrix.environment)] }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets[format('{0}_FIREBASE_PROJECT_ID', matrix.environment)] }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets[format('{0}_FIREBASE_STORAGE_BUCKET', matrix.environment)] }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets[format('{0}_FIREBASE_MESSAGING_SENDER_ID', matrix.environment)] }}" >> .env.production
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets[format('{0}_FIREBASE_APP_ID', matrix.environment)] }}" >> .env.production
          echo "GEMINI_API_KEY=${{ secrets[format('{0}_GEMINI_API_KEY', matrix.environment)] }}" >> .env.production
          echo "NODE_ENV=production" >> .env.production
          echo "NEXT_PUBLIC_ENVIRONMENT=${{ matrix.environment }}" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_ERROR_LOGGING=true" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_PERFORMANCE_MONITORING=true" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_API_MONITORING=true" >> .env.production
          echo "RATE_LIMIT_WINDOW_MS=900000" >> .env.production
          echo "RATE_LIMIT_MAX_REQUESTS=100" >> .env.production
          
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.environment }}
          path: |
            out/
            .next/
            functions/
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-staging
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Create Firebase service account key
        run: echo '${{ secrets.STAGING_FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json
        
      - name: Deploy to Firebase Staging
        run: |
          firebase use staging --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only hosting,functions --project staging --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
          
      - name: Run deployment verification
        run: |
          sleep 30  # Wait for deployment to propagate
          curl -f https://${{ secrets.STAGING_FIREBASE_PROJECT_ID }}.web.app/api/health || exit 1
          
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "🌐 URL: https://${{ secrets.STAGING_FIREBASE_PROJECT_ID }}.web.app"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-production
          
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
        
      - name: Create Firebase service account key
        run: echo '${{ secrets.PRODUCTION_FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json
        
      - name: Deploy to Firebase Production
        run: |
          firebase use production --token ${{ secrets.FIREBASE_TOKEN }}
          firebase deploy --only hosting,functions --project production --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: firebase-service-account.json
          
      - name: Run deployment verification
        run: |
          sleep 30  # Wait for deployment to propagate
          curl -f https://${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}.web.app/api/health || exit 1
          
      - name: Run smoke tests
        run: |
          # Basic smoke tests for critical endpoints
          curl -f https://${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}.web.app/ || exit 1
          curl -f https://${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}.web.app/api/health || exit 1
          
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "🌐 URL: https://${{ secrets.PRODUCTION_FIREBASE_PROJECT_ID }}.web.app"
          
      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed, consider rollback"
          # Add rollback logic here if needed

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run security audit
        run: npm audit --audit-level moderate
        
      - name: Check for secrets in code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD